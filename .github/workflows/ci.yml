name: CI

on:
  push:
    branches: [main, "main-2"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests (回归冒烟)
        run: uv run pytest tests/ -q
